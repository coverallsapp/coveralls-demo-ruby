name: Test Coveralls
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      NODE_COVERALLS_DEBUG: 1
    steps:

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.6.3
        bundler-cache: true

    - name: Run tests
      run: bundle exec rspec

    # - name: Coveralls Coverage Report Upload
    #   uses: coverallsapp/github-action@v2
    #   with:
    #     github-token: ${{ secrets.GITHUB_TOKEN }}
    #     file: ./coverage/lcov/coveralls-demo-ruby.lcov
    #     coveralls-endpoint: https://enterprise-demo.coveralls.io

    - name: Coveralls Parallel Upload 1
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: ./coverage/lcov/coveralls-demo-ruby.lcov
        coveralls-endpoint: https://enterprise-demo.coveralls.io
        flag-name: subproject-test-01
        parallel: true

    # - name: Coveralls Parallel Upload 2
    #   uses: coverallsapp/github-action@v2
    #   with:
    #     github-token: ${{ secrets.GITHUB_TOKEN }}
    #     file: ./coverage/lcov/coveralls-demo-ruby.lcov
    #     coveralls-endpoint: https://enterprise-demo.coveralls.io
    #     flag-name: subproject-test-02
    #     parallel: true

  finish:
    needs: build_and_test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        coveralls-endpoint: https://enterprise-demo.coveralls.io
        parallel-finished: true
        # carryforward: "subproject-test-01,subproject-test-02"
        carryforward: "subproject-test-02"
